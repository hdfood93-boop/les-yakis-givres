<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Banque d'images – Les Yakis Givrés</title>
<style>
  :root { --rouge: #D3202F; --fond: #F7F0E3; --encre: #1d1a17; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--fond); color: var(--encre); padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  p { color: #6b5f50; margin-bottom: 22px; }
  h2 { font-size: 20px; margin: 18px 0 12px; border-left: 5px solid var(--rouge); padding-left: 10px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  a.carte { display: block; background: #fff; border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--encre); box-shadow: 0 4px 14px rgba(60,30,0,.12); }
  a.carte img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  a.carte span { display: block; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<h1>Banque d'images – Les Yakis Givrés</h1>
<p>Page interne, non référencée. Clique sur une image pour l'ouvrir en grand, puis clic droit et « Enregistrer l'image ».</p>

<h2>Anciennes publications Facebook (2023)</h2>
<div class="grille" id="fb2023"></div>

<script>
const FB2023 = [
  ['01', 'Brochettes de boulettes, main'], ['02', 'Boîtes + sauce soja'], ['03', 'Affiche dégustation Créteil (mars 2023)'],
  ['04', 'Logo sur fond noir'], ['05', 'Boîte Boulette Poulet'], ['06', 'Boulettes de poulet, assiette'],
  ['07', 'Boîte Bœuf Fromage'], ['08', 'Boîte Bœuf Fromage (vertical)'], ['09', 'Sésame sur brochettes'],
  ['10', 'Affiche dégustation Rosny'], ['11', 'Brochettes poulet sur plat'], ['12', 'Brochette bœuf fromage crue'],
  ['13', 'Boîte Poulet Satay'], ['14', 'Sauce soja sur boulettes'], ['16', 'Brochettes à la plancha'],
];
document.getElementById('fb2023').innerHTML = FB2023.map(([n, t]) =>
  `<a class="carte" href="facebook-2023/yakis-fb-${n}.jpg" target="_blank"><img src="facebook-2023/yakis-fb-${n}.jpg" alt="${t}" loading="lazy"><span>${n} · ${t}</span></a>`).join('');
</script>
</body>
</html>
